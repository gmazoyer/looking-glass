---
name: Build and push Docker image
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Build Docker image tags
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ github.repository }}
          # value is needed because a manual run has a branch ref, not a tag ref
          tags: |
            type=semver,pattern={{major}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},value=${{ env.TAG_NAME }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # build the checked-out tag, not the Git context of github.sha
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
